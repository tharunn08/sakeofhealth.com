# Quality gate: every push and pull request runs ALL checks, including the MySQL 8 suites on a throw-away
# MySQL 8 service. A red result blocks the merge (make this check "required" in the repository's branch
# protection) and the release (deploy only from a green commit). Nothing here can reach production:
# the database is a container that exists only for this run, with a test-only account.
name: quality-gate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          # throw-away container credentials for this CI run only — not a real secret
          MYSQL_ROOT_PASSWORD: ci-root-not-used-by-tests
          MYSQL_DATABASE: sakeofhealth_test
          MYSQL_USER: soh_test
          MYSQL_PASSWORD: ci-test-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-not-used-by-tests"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '3306'
      TEST_DB_USER: soh_test
      TEST_DB_PASSWORD: ci-test-only-password
      TEST_DB_NAME: sakeofhealth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install (exact lockfile)
        run: npm ci
      # The tests run first, so a known package advisory never hides the test results; the audit still
      # runs on every build and still turns the gate red while any high or critical advisory is open.
      - name: Release gate (all checks + MySQL 8 suites; blocks on any failure or on suites not run)
        run: node scripts/release-gate.js
      - name: Dependency audit (production dependencies, high and critical)
        if: always()
        run: npm audit --omit=dev --audit-level=high
      - name: Show failing tests in the log
        if: failure()
        run: |
          for f in test-results/*/mysql/*.tap.txt; do
            if grep -q '^not ok' "$f" || ! grep -q '^# pass' "$f"; then
              echo "::group::$(basename "$f")"
              grep -n -A30 '^not ok' "$f" | head -400 || true
              grep -q '^# pass' "$f" || tail -60 "$f"
              echo "::endgroup::"
            fi
          done
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
